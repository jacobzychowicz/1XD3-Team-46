<!doctype html>

<html>

<head>
    <meta charset="utf-8">
    <title>Posts</title>
    <script src="post.js"></script>
</head>

<body>
    <div id="postContainer"></div>

    <form id="addPost">
        <h2>Add Post</h2>
        <input id="postName" placeholder="Post Title" type="text">
        <textarea id="postDesc" placeholder="Describe your post..."></textarea>
        <input id="postAttach" placeholder="Image URL (optional)" type="text">
        <button type="submit">Add Post</button>
    </form>

    <form id="editPost" style="display: none; border: 1px solid black; padding: 10px; margin-top: 20px;">
        <h2>Edit Post</h2>
        <input type="hidden" id="editId">
        <input id="editName" type="text" placeholder="New Title">
        <textarea id="editDesc" placeholder="New Description"></textarea>
        <button type="submit">Save Changes</button>
        <button type="button" onclick="document.getElementById('editPost').style.display='none'">Cancel</button>
    </form>

    <form id="deletePost">
        <h2>Delete Post</h2>
    </form>
</body>

</html>
